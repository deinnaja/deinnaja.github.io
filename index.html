<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Karya &amp; Sertifikat</title>
  <meta name="description" content="Portofolio pribadi kreator lintas bidang berisi karya visual dan daftar sertifikat.">
  <meta name="theme-color" content="#2338D9">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portofolio Karya &amp; Sertifikat">
  <meta property="og:description" content="Portofolio pribadi kreator lintas bidang berisi karya visual dan daftar sertifikat.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232338D9'/%3E%3Crect x='7' y='7' width='18' height='6' fill='%23EEF0F4'/%3E%3Crect x='7' y='16' width='11' height='9' fill='%23FFD83D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    /* ========================================================================
       DESIGN TOKENS — SESUAI PRD BAGIAN 7
       Kobalt #2338D9 (hero), Kertas #EEF0F4, Tinta #181A20,
       Penanda Kuning #FFD83D (KHUSUS fokus & hover)
       ======================================================================== */
    :root {
      --cobalt: #2338D9;
      --paper: #EEF0F4;
      --paper-subtle: #E5E8EE;
      --ink: #181A20;
      --ink-muted: #4A4F5C;
      --ink-line: rgba(24, 26, 32, 0.16);
      --ink-line-strong: rgba(24, 26, 32, 0.34);
      --hero-ink: #FFFFFF;
      --hero-ink-soft: #DCE2FD;
      --hero-line: rgba(238, 240, 244, 0.28);
      --marker: #FFD83D;

      --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;

      --container-max: 1240px;
      --gutter: clamp(1.125rem, 4vw, 3rem);
      --nav-h: 62px;

      --ease-out: cubic-bezier(0.2, 0, 0, 1);
      --ease-editorial: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--nav-h) + 24px);
      background-color: var(--paper);
      color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1.0625rem;
      line-height: 1.62;
      color: var(--ink);
      background-color: var(--paper);
      overflow-x: clip;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    h1, h2, h3, h4 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.12;
      color: inherit;
    }

    p {
      margin: 0;
    }

    ul, ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ========================================================================
       FOKUS KEYBOARD (WCAG AA/AAA 1.4.11)
       Penanda kuning #FFD83D dipasangkan bingkai tinta #181A20 di atas kertas
       agar kontras melampaui 12:1, dan kuning murni di atas kobalt (5.7:1).
       ======================================================================== */
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: 0 0 0 5px var(--marker);
    }

    .hero :focus-visible {
      outline: 3px solid var(--marker);
      outline-offset: 3px;
      box-shadow: none;
    }

    .skip-link {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 100;
      padding: 0.75rem 1.125rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      text-decoration: none;
      background-color: var(--marker);
      color: var(--ink);
      border: 2px solid var(--ink);
      transform: translateY(-200%);
      transition: transform 150ms var(--ease-out);
    }

    .skip-link:focus-visible {
      transform: translateY(0);
      outline: 2px solid var(--ink);
      outline-offset: 2px;
      box-shadow: none;
    }

    /* ========================================================================
       CONTAINER & LAYOUT HARMONY (EQUAL LEFT/RIGHT EDGES)
       ======================================================================== */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }

    /* ========================================================================
       NAVIGASI MENEMPEL DI ATAS (F6)
       ======================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--paper);
      border-bottom: 1px solid var(--ink-line);
    }

    .header-inner {
      min-height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      min-height: 44px;
      padding-inline: 0.25rem;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.0625rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      background-color: var(--cobalt);
      flex-shrink: 0;
      display: inline-block;
    }

    .nav-desktop {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.5rem 0.875rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--ink);
      text-decoration: none;
      position: relative;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }

    .nav-link[aria-current="location"] {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 6px;
    }

    .menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 44px;
      min-width: 44px;
      padding: 0.5rem 0.875rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--ink);
      background-color: transparent;
      border: 1px solid var(--ink-line-strong);
      cursor: pointer;
      transition: background-color 150ms var(--ease-out), transform 150ms var(--ease-out);
    }

    .menu-toggle:not(:disabled):active {
      transform: scale(0.96);
    }

    .nav-mobile-panel {
      display: none;
      border-top: 1px solid var(--ink-line);
      background-color: var(--paper);
      padding: 0.75rem var(--gutter) 1.25rem;
    }

    .nav-mobile-panel.is-open {
      display: block;
    }

    .nav-mobile-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-mobile-list .nav-link {
      width: 100%;
      padding-inline: 0.5rem;
      border-bottom: 1px solid var(--ink-line);
      font-size: 1.0625rem;
    }

    .nav-mobile-list li:last-child .nav-link {
      border-bottom: none;
    }

    @media (max-width: 639px) {
      .nav-desktop {
        display: none;
      }

      .menu-toggle {
        display: inline-flex;
      }
    }

    @media (hover: hover) {
      .brand-link:hover,
      .nav-link:hover,
      .menu-toggle:hover {
        background-color: var(--marker);
        color: var(--ink);
      }
    }

    /* ========================================================================
       HERO BLOK KOBALT (#2338D9)
       Satu momen yang diingat: nama besar naik saat halaman dibuka.
       ======================================================================== */
    .hero {
      background-color: var(--cobalt);
      color: var(--hero-ink);
      min-height: clamp(480px, calc(100svh - var(--nav-h)), 760px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-block: clamp(2.75rem, 6.5vh, 4.5rem) clamp(2.5rem, 5.5vh, 4rem);
      border-bottom: 1px solid var(--ink);
    }

    .hero-inner {
      display: flex;
      flex-direction: column;
      gap: clamp(2.25rem, 5.5vh, 4.25rem);
    }

    .hero-name-wrap {
      margin: 0;
    }

    .hero-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.6rem, 12vw, 9.85rem);
      line-height: 0.9;
      letter-spacing: -0.045em;
      color: var(--hero-ink);
      word-break: break-word;
    }

    .hero-name-mask {
      display: block;
      overflow: hidden;
      padding-bottom: 0.08em;
      margin-bottom: -0.06em;
    }

    .hero-name-line {
      display: block;
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes heroNameRise {
        from {
          transform: translateY(108%);
          opacity: 0.01;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .hero-name-line {
        animation: heroNameRise 820ms var(--ease-editorial) both;
      }

      .hero-name-mask:nth-child(2) .hero-name-line {
        animation-delay: 110ms;
      }

      .hero-name-mask:nth-child(3) .hero-name-line {
        animation-delay: 200ms;
      }
    }

    .hero-foot {
      border-top: 1px solid var(--hero-line);
      padding-top: clamp(1.25rem, 3vh, 2rem);
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 0.9fr);
      gap: 1.5rem 2.5rem;
      align-items: end;
    }

    .hero-role {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.125rem, 1.85vw, 1.4375rem);
      line-height: 1.28;
      letter-spacing: -0.015em;
      color: var(--hero-ink);
      margin-bottom: 0.625rem;
    }

    .hero-summary {
      font-family: var(--font-body);
      font-size: clamp(1rem, 1.25vw, 1.125rem);
      line-height: 1.58;
      color: var(--hero-ink-soft);
      max-width: 54ch;
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1.125rem;
    }

    .hero-meta {
      font-family: var(--font-body);
      font-size: 0.9375rem;
      line-height: 1.5;
      color: var(--hero-ink-soft);
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .hero-meta strong {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--hero-ink);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
    }

    .btn-hero-primary,
    .btn-hero-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 46px;
      padding: 0.625rem 1.35rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 150ms var(--ease-out),
                  color 150ms var(--ease-out),
                  border-color 150ms var(--ease-out),
                  transform 150ms var(--ease-out);
    }

    .btn-hero-primary {
      background-color: var(--paper);
      color: var(--ink);
      border: 1.5px solid var(--paper);
    }

    .btn-hero-secondary {
      background-color: transparent;
      color: var(--hero-ink);
      border: 1.5px solid rgba(238, 240, 244, 0.72);
    }

    .btn-hero-primary:active,
    .btn-hero-secondary:active {
      transform: scale(0.96);
    }

    @media (hover: hover) {
      .btn-hero-primary:hover,
      .btn-hero-secondary:hover {
        background-color: var(--marker);
        border-color: var(--marker);
        color: var(--ink);
      }
    }

    @media (max-width: 820px) {
      .hero {
        min-height: auto;
        padding-block: 3rem 2.5rem;
      }

      .hero-foot {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .hero-actions a {
        flex: 1 1 100%;
      }
    }

    /* ========================================================================
       SECTION BASE — TENANG, KERTAS #EEF0F4, GARIS TEGAS
       ======================================================================== */
    .section {
      padding-block: clamp(3.5rem, 8vw, 6.25rem);
    }

    .section + .section {
      border-top: 1px solid var(--ink-line);
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
      margin-bottom: clamp(1.75rem, 3.5vw, 2.75rem);
    }

    .section-title {
      font-size: clamp(2rem, 4.2vw, 3.125rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .section-count {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
    }

    /* ========================================================================
       GALERI KARYA MASONRY + FILTER KATEGORI (F2, F5)
       ======================================================================== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: clamp(1.75rem, 3.5vw, 2.5rem);
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--ink-line);
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 44px;
      padding: 0.5rem 1rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.9375rem;
      color: var(--ink);
      background-color: transparent;
      border: 1px solid var(--ink-line-strong);
      cursor: pointer;
      transition: background-color 150ms var(--ease-out),
                  color 150ms var(--ease-out),
                  border-color 150ms var(--ease-out),
                  transform 150ms var(--ease-out);
    }

    .filter-btn[aria-pressed="true"] {
      background-color: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .filter-btn:not(:disabled):active {
      transform: scale(0.96);
    }

    .filter-count {
      font-variant-numeric: tabular-nums;
      font-size: 0.875rem;
      opacity: 0.78;
    }

    @media (hover: hover) {
      .filter-btn:hover {
        background-color: var(--marker);
        border-color: var(--ink);
        color: var(--ink);
      }
    }

    /* Masonry: kolom seimbang kiri-ke-kanan, tanpa sudut bulat seragam */
    .masonry-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(1.5rem, 2.6vw, 2.25rem);
      align-items: start;
    }

    .masonry-col {
      display: flex;
      flex-direction: column;
      gap: clamp(2rem, 3.5vw, 2.85rem);
      min-width: 0;
    }

    @media (max-width: 1023px) {
      .masonry-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 639px) {
      .masonry-grid {
        grid-template-columns: 1fr;
      }
    }

    .work-item {
      margin: 0;
      min-width: 0;
    }

    .work-trigger {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      text-align: left;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      font: inherit;
    }

    .work-media {
      position: relative;
      width: 100%;
      overflow: hidden;
      background-color: var(--paper-subtle);
      border: 1px solid rgba(24, 26, 32, 0.12);
    }

    .work-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      outline: 1px solid oklch(0 0 0 / 0.1);
      outline-offset: -1px;
      transition: transform 320ms var(--ease-out);
    }

    @media (prefers-reduced-motion: reduce) {
      .work-media img {
        transition: none;
      }
    }

    .work-meta {
      padding-top: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .work-meta-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .work-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.125rem;
      line-height: 1.24;
      letter-spacing: -0.02em;
      color: var(--ink);
      display: inline;
      padding: 0.08em 0.16em;
      margin-left: -0.16em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
      transition: background-color 150ms var(--ease-out);
    }

    .work-arrow {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      color: var(--ink-muted);
      flex-shrink: 0;
      transition: transform 180ms var(--ease-out), color 150ms var(--ease-out);
    }

    .work-sub {
      font-family: var(--font-body);
      font-size: 0.9375rem;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    @media (hover: hover) {
      .work-trigger:hover .work-media img {
        transform: scale(1.028);
      }

      .work-trigger:hover .work-title {
        background-color: var(--marker);
        color: var(--ink);
      }

      .work-trigger:hover .work-arrow {
        color: var(--ink);
        transform: translate(2px, -2px);
      }
    }

    .work-trigger:focus-visible .work-title {
      background-color: var(--marker);
      color: var(--ink);
    }

    /* ========================================================================
       BLOK WARNA OTOMATIS KETIKA GAMBAR HILANG / GAGAL MUAT (F5)
       ======================================================================== */
    .media-fallback {
      width: 100%;
      height: 100%;
      padding: clamp(1rem, 3vw, 1.5rem);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #FFFFFF;
      position: relative;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .media-fallback-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-display);
      font-size: 0.8125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      opacity: 0.88;
    }

    .media-fallback-monogram {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.75rem, 4vw, 3rem);
      letter-spacing: -0.04em;
      line-height: 1;
      opacity: 0.96;
    }

    .media-fallback-note {
      font-family: var(--font-body);
      font-size: 0.875rem;
      line-height: 1.35;
      opacity: 0.86;
      max-width: 26ch;
    }

    .media-fallback--compact {
      padding: 0.625rem;
      background-size: 20px 20px;
    }

    .media-fallback--compact .media-fallback-monogram {
      font-size: 1.25rem;
    }

    .media-fallback--compact .media-fallback-note {
      display: none;
    }

    /* ========================================================================
       DAFTAR SERTIFIKAT (F4) — EDITORIAL LEDGER BUKAN KARTU SERAGAM
       ======================================================================== */
    .certs-list {
      border-top: 1px solid var(--ink-line-strong);
    }

    .cert-row {
      display: grid;
      grid-template-columns: 132px minmax(0, 1.55fr) minmax(0, 0.85fr) auto auto;
      gap: 1rem 1.75rem;
      align-items: center;
      padding-block: 1.35rem;
      padding-left: 0.75rem;
      margin-left: -0.75rem;
      border-bottom: 1px solid var(--ink-line);
      border-left: 4px solid transparent;
      transition: border-left-color 150ms var(--ease-out), background-color 150ms var(--ease-out);
    }

    @media (hover: hover) {
      .cert-row:hover {
        border-left-color: var(--marker);
        background-color: rgba(24, 26, 32, 0.025);
      }
    }

    .cert-thumb-btn {
      display: block;
      width: 132px;
      aspect-ratio: 4 / 3;
      padding: 0;
      border: 1px solid rgba(24, 26, 32, 0.18);
      background-color: var(--paper-subtle);
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cert-thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 280ms var(--ease-out);
    }

    @media (prefers-reduced-motion: reduce) {
      .cert-thumb-btn img {
        transition: none;
      }
    }

    @media (hover: hover) {
      .cert-thumb-btn:hover img {
        transform: scale(1.03);
      }
    }

    .cert-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .cert-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.24;

    .cert-year {

      font-weight: 700;
      font-size: 0.9375rem;

    .cert-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.5rem;

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 44px;
      padding: 0.5rem 0.95rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--ink);
      background-color: transparent;
      border: 1px solid var(--ink-line-strong);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease-out),
                  border-color 150ms var(--ease-out),
                  color 150ms var(--ease-out),
                  transform 150ms var(--ease-out);
    }

    .btn-outline:not(:disabled):active {
      transform: scale(0.96);
    }

    .btn-solid {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 44px;
      padding: 0.55rem 1.15rem;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--paper);
      background-color: var(--ink);
      border: 1px solid var(--ink);
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms var(--ease-out),
                  border-color 150ms var(--ease-out),
                  color 150ms var(--ease-out),
                  transform 150ms var(--ease-out);
    }

    .btn-solid:not(:disabled):active {
      transform: scale(0.96);
    }

    @media (hover: hover) {
      .btn-outline:hover,
      .btn-solid:hover {
        background-color: var(--marker);
        border-color: var(--ink);
        color: var(--ink);

    @media (max-width: 980px) {
      .cert-row {
        grid-template-columns: 112px minmax(0, 1fr);
        align-items: start;
        gap: 0.875rem 1.25rem;

      .cert-thumb-btn {
        width: 112px;
        grid-row: span 3;

      .cert-year,

        justify-content: flex-start;

    @media (max-width: 520px) {
      .cert-row {
        grid-template-columns: 1fr;
        padding-left: 0;

        border-left: 0;

        width: 100%;
        max-width: 240px;
        grid-row: auto;

      .cert-issuer-col,

        grid-column: 1;
      }

        width: 100%;
      }

        flex: 1 1 auto;
      }

    /* ========================================================================
       TENTANG — KOMPOSISI EDITORIAL ASIMETRIS
       ======================================================================== */
    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.35fr);
      gap: clamp(2rem, 5vw, 4.5rem);
      align-items: start;
    }

    .about-lead {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.375rem, 2.5vw, 1.875rem);
      line-height: 1.26;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .about-body {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      font-size: 1.125rem;
      line-height: 1.68;
      max-width: 62ch;
    }

    .about-columns {
      margin-top: 2rem;
      padding-top: 1.75rem;
      border-top: 1px solid var(--ink-line);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.75rem 2.25rem;
    }

    .about-subhead {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.0625rem;
      margin-bottom: 0.875rem;
      color: var(--ink);
    }

    .about-list {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      font-size: 0.975rem;
      line-height: 1.5;
      color: var(--ink);

      padding-left: 1rem;

    .about-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.58em;
      width: 6px;
      height: 6px;
      background-color: var(--cobalt);

    .principle-list {
      display: flex;
      flex-direction: column;

    .principle-item strong {

       KONTAK — LANGSUNG, TANPA FORMULIR SERVER
       ======================================================================== */
    .contact-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      gap: clamp(1.75rem, 4vw, 4rem);
      align-items: start;

    /* ========================================================================
       DIALOG LIGHTBOX (F3 & F4) — NATIVE <dialog>, ESC TUTUP, TRAP FOKUS
       ======================================================================== */
    dialog.lightbox {
      width: min(1040px, calc(100vw - 2rem));
      max-width: 1040px;
      max-height: calc(100dvh - 2rem);
      padding: 0;
      margin: auto;
      border: 1.5px solid var(--ink);
      background-color: var(--paper);
      color: var(--ink);
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(24, 26, 32, 0.28);
    }

    dialog.lightbox[open] {
      display: flex;
      flex-direction: column;
    }

    dialog.lightbox::backdrop {
      background-color: rgba(24, 26, 32, 0.72);
    }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes dialogEnter {
        from {
          opacity: 0;
          transform: scale(0.985) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

        animation: dialogEnter 240ms var(--ease-out) both;
      }

    .lightbox-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem 1.125rem;
      border-bottom: 1px solid var(--ink-line);
      background-color: var(--paper);

      font-weight: 700;
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);

    .lightbox-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lightbox-scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: clamp(1.25rem, 3vw, 2.25rem);
    }

    .lightbox-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
      gap: clamp(1.5rem, 3.5vw, 2.75rem);
      align-items: start;
    }

    .lightbox-stage {

      background-color: var(--paper-subtle);
      border: 1px solid rgba(24, 26, 32, 0.14);
      overflow: hidden;
    }

    .lightbox-stage img {
      width: 100%;
      height: auto;
      max-height: 68dvh;
      object-fit: contain;
      margin-inline: auto;
      outline: 1px solid oklch(0 0 0 / 0.1);
      outline-offset: -1px;
    }

    .lightbox-info {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      min-width: 0;
    }

    .lightbox-title {
      font-size: clamp(1.5rem, 2.8vw, 2.125rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;

    .lightbox-facts {

      padding-bottom: 1rem;
      border-bottom: 1px solid var(--ink-line);

      font-weight: 600;
      font-size: 0.9375rem;
      font-variant-numeric: tabular-nums;

    .case-blocks {

    .case-block {

    .tools-list {

    .tool-tag {

    .lightbox-ext {

    @media (max-width: 820px) {

    /* Empty / no-data fallback */

      padding: 2.5rem 1.5rem;
      border: 1px solid var(--ink-line-strong);
      font-size: 1rem;
      color: var(--ink-muted);
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";

      const DATA = window.PORTFOLIO_DATA;
      if (!DATA) {
        const main = document.getElementById("konten-utama");
        if (main) {
          const notice = document.createElement("div");
          notice.className = "container section";
          notice.textContent = "Berkas data.js tidak ditemukan atau tidak valid. Pastikan data.js berada di folder yang sama dengan index.html.";
          main.replaceChildren(notice);
        }
        return;
      }

      /* ----------------------------------------------------------------------
         UTILITAS KEAMANAN & DOM (Semua teks dirender lewat textContent — anti XSS)
         ---------------------------------------------------------------------- */
      const FALLBACK_SWATCHES = [
        "#2338D9",
        "#263042",
        "#234B3E",
        "#8C3B2B",
        "#7A5C2E",
        "#2D313A"
      ];

      function str(value) {
        return typeof value === "string" ? value.trim() : "";
      }

      function safeExternalUrl(raw) {
        const s = str(raw);
        if (!s) return "";
        try {
          const parsed = new URL(s, window.location.href);
          if (parsed.protocol === "https:" || parsed.protocol === "http:") {
            return parsed.href;
          }
        } catch (_) {
          return "";
        }
        return "";
      }

      function safeAnchorOrUrl(raw) {
        const s = str(raw);
        if (!s) return "";
        if (s.startsWith("#") && /^#[a-zA-Z0-9_-]+$/.test(s)) return s;
        return safeExternalUrl(s);
      }

      function safeAssetPath(raw) {
        const s = str(raw);
        if (!s) return "";
        if (/^(javascript|vbscript|data):/i.test(s)) return "";
        return s;
      }

      function safeHexColor(raw, index) {
        const s = str(raw);
        if (/^#[0-9a-fA-F]{6}$/.test(s)) return s;
        return FALLBACK_SWATCHES[index % FALLBACK_SWATCHES.length];
      }

      function safeAspectRatio(raw) {
        const s = str(raw);
        if (/^\d+(\.\d+)?\s*\/\s*\d+(\.\d+)?$/.test(s)) return s;
        return "4 / 3";
      }

      function parseRatioNumber(ratioStr) {
        const parts = safeAspectRatio(ratioStr).split("/");
        const w = parseFloat(parts[0]) || 4;
        const h = parseFloat(parts[1]) || 3;
        return h / w;
      }

      function getInitials(title) {
        const words = str(title).split(/\s+/).filter(Boolean);
        if (words.length === 0) return "KR";
        if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
        return (words[0][0] + words[1][0]).toUpperCase();
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (typeof text === "string") node.textContent = text;
        return node;
      }

      /* ----------------------------------------------------------------------
         BLOK WARNA OTOMATIS JIKA GAMBAR HILANG / GAGAL MUAT (F5)
         ---------------------------------------------------------------------- */
      function buildColorFallback(options) {
        const box = el(
          "div",
          options.compact ? "media-fallback media-fallback--compact" : "media-fallback"
        );
        box.style.backgroundColor = safeHexColor(options.color, options.index || 0);
        box.setAttribute("role", "img");
        box.setAttribute("aria-label", options.alt || options.title || "Blok pratinjau karya");

        const top = el("div", "media-fallback-top");
        top.append(
          el("span", "", String((options.index || 0) + 1).padStart(2, "0")),
          el("span", "", str(options.tag) || "Pratinjau")
        );

        const mono = el("div", "media-fallback-monogram", getInitials(options.title));
        const note = el("div", "media-fallback-note", str(options.title));

        box.append(top, mono, note);
        return box;
      }

      function mountResilientMedia(container, options) {
        container.replaceChildren();
        const src = safeAssetPath(options.src);

        const showFallback = () => {
          container.replaceChildren(buildColorFallback(options));
        };

        if (!src) {
          showFallback();
          return;
        }

        const img = document.createElement("img");
        img.src = src;
        img.alt = str(options.alt) || str(options.title) || "Gambar karya";
        img.loading = options.eager ? "eager" : "lazy";
        img.decoding = "async";

        img.addEventListener("error", showFallback, { once: true });
        container.appendChild(img);

        if (img.complete && img.naturalWidth === 0) {
          showFallback();
        }
      }

      /* ----------------------------------------------------------------------
         1. META, NAVIGASI & HERO
         ---------------------------------------------------------------------- */
      const site = DATA.site || {};
      const hero = DATA.hero || {};
      const works = Array.isArray(DATA.works) ? DATA.works : [];
      const certs = Array.isArray(DATA.certs) ? DATA.certs : [];
      const about = DATA.about || {};
      const contact = DATA.contact || {};

      if (str(site.title)) {
        document.title = str(site.title);
        const ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute("content", str(site.title));
      }
      if (str(site.description)) {
        const descMeta = document.querySelector('meta[name="description"]');
        if (descMeta) descMeta.setAttribute("content", str(site.description));
        const ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute("content", str(site.description));
      }

      document.getElementById("brand-name").textContent = str(site.shortName) || "Portofolio";

      const sectionTitles = site.sectionTitles || {};
      document.getElementById("heading-works").textContent = str(sectionTitles.works) || "Karya Pilihan";
      document.getElementById("heading-certs").textContent = str(sectionTitles.certs) || "Sertifikat & Kredensial";
      document.getElementById("heading-about").textContent = str(sectionTitles.about) || "Tentang";
      document.getElementById("heading-contact").textContent = str(sectionTitles.contact) || "Kontak";

      const navLabels = site.navLabels || {};
      const navItems = [
        { href: "#karya", label: str(navLabels.works) || "Karya" },
        { href: "#sertifikat", label: str(navLabels.certs) || "Sertifikat" },
        { href: "#tentang", label: str(navLabels.about) || "Tentang" },
        { href: "#kontak", label: str(navLabels.contact) || "Kontak" }
      ];

      const navDesktop = document.getElementById("nav-desktop");
      const navMobileList = document.getElementById("nav-mobile-list");
      const navMobilePanel = document.getElementById("nav-mobile-panel");
      const menuToggle = document.getElementById("menu-toggle");
      const menuToggleLabel = document.getElementById("menu-toggle-label");

      function closeMobileMenu() {
        navMobilePanel.classList.remove("is-open");
        navMobilePanel.hidden = true;
        menuToggle.setAttribute("aria-expanded", "false");
        menuToggle.setAttribute("aria-label", "Buka menu navigasi");
        menuToggleLabel.textContent = "Menu";
      }

      function toggleMobileMenu() {
        const isOpen = navMobilePanel.classList.toggle("is-open");
        navMobilePanel.hidden = !isOpen;
        menuToggle.setAttribute("aria-expanded", String(isOpen));
        menuToggle.setAttribute("aria-label", isOpen ? "Tutup menu navigasi" : "Buka menu navigasi");
        menuToggleLabel.textContent = isOpen ? "Tutup" : "Menu";
      }

      menuToggle.addEventListener("click", toggleMobileMenu);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && navMobilePanel.classList.contains("is-open")) {
          closeMobileMenu();
          menuToggle.focus();
        }
      });

      navItems.forEach((item) => {
        const aDesk = el("a", "nav-link", item.label);
        aDesk.href = item.href;
        navDesktop.appendChild(aDesk);

        const li = el("li");
        const aMob = el("a", "nav-link", item.label);
        aMob.href = item.href;
        aMob.addEventListener("click", closeMobileMenu);
        li.appendChild(aMob);
        navMobileList.appendChild(li);
      });

      // Render Hero Name (baris yang naik di blok kobalt)
      const heroHeading = document.getElementById("hero-heading");
      const nameLines = Array.isArray(hero.nameLines) && hero.nameLines.length > 0
        ? hero.nameLines
        : [str(site.shortName) || "Nama Kreator"];

      nameLines.forEach((lineText) => {
        const mask = el("span", "hero-name-mask");
        const line = el("span", "hero-name-line", str(lineText));
        mask.appendChild(line);
        heroHeading.appendChild(mask);
      });

      document.getElementById("hero-role").textContent = str(hero.role);
      document.getElementById("hero-summary").textContent = str(hero.summary);

      const heroMeta = document.getElementById("hero-meta");
      if (str(hero.metaLocation)) {
        heroMeta.appendChild(el("strong", "", str(hero.metaLocation)));
      }
      if (str(hero.metaAvailability)) {
        heroMeta.appendChild(el("span", "", str(hero.metaAvailability)));
      }
      heroMeta.appendChild(
        el("span", "", works.length + " karya tersimpan · " + certs.length + " sertifikat")
      );

      const heroActions = document.getElementById("hero-actions");
      const primaryHref = safeAnchorOrUrl(hero.primaryCtaHref) || "#karya";
      const primaryBtn = el("a", "btn-hero-primary", str(hero.primaryCtaLabel) || "Jelajahi Karya");
      primaryBtn.href = primaryHref;
      heroActions.appendChild(primaryBtn);

      if (str(hero.secondaryCtaLabel)) {
        const secBtn = el("a", "btn-hero-secondary", str(hero.secondaryCtaLabel));
        secBtn.href = safeAnchorOrUrl(hero.secondaryCtaHref) || "#kontak";
        heroActions.appendChild(secBtn);
      }

      /* ----------------------------------------------------------------------
         2. GALERI KARYA MASONRY + FILTER KATEGORI (F2, F3, F5)
         ---------------------------------------------------------------------- */
      const ALL_CATEGORY = "Semua";
      let activeCategory = ALL_CATEGORY;
      let filteredWorks = works.slice();

      const worksFiltersEl = document.getElementById("works-filters");
      const worksMasonryEl = document.getElementById("works-masonry");
      const worksCountEl = document.getElementById("works-count");
      const worksStatusEl = document.getElementById("works-status");

      const categoryCounts = new Map();
      categoryCounts.set(ALL_CATEGORY, works.length);
      works.forEach((item) => {
        const cat = str(item.category) || "Lainnya";
        categoryCounts.set(cat, (categoryCounts.get(cat) || 0) + 1);
      });

      function getColumnCount() {
        const width = window.innerWidth;
        if (width >= 1024) return 3;
        if (width >= 640) return 2;
        return 1;
      }

      const filterButtons = new Map();

      function syncFilterButtons() {
        filterButtons.forEach((btn, category) => {
          btn.setAttribute("aria-pressed", String(category === activeCategory));
        });
      }

      function initFilters() {
        worksFiltersEl.replaceChildren();
        filterButtons.clear();

        categoryCounts.forEach((count, category) => {
          const btn = el("button", "filter-btn");
          btn.type = "button";
          btn.setAttribute("aria-pressed", String(category === activeCategory));

          btn.append(
            el("span", "", category),
            el("span", "filter-count", "(" + count + ")")
          );

          btn.addEventListener("click", () => {
            if (activeCategory === category) return;
            activeCategory = category;
            filteredWorks = category === ALL_CATEGORY
              ? works.slice()
              : works.filter((w) => (str(w.category) || "Lainnya") === category);
            syncFilterButtons();
            renderMasonry();
            worksStatusEl.textContent = category === ALL_CATEGORY
              ? "Menampilkan seluruh " + filteredWorks.length + " karya."
              : "Menampilkan " + filteredWorks.length + " karya dalam kategori " + category + ".";
          });

          filterButtons.set(category, btn);
          worksFiltersEl.appendChild(btn);
        });
      }

      let lastColCount = getColumnCount();

      function renderMasonry() {
        worksCountEl.textContent = filteredWorks.length === works.length
          ? works.length + " karya"
          : filteredWorks.length + " dari " + works.length + " karya";

        worksMasonryEl.replaceChildren();

        if (filteredWorks.length === 0) {
          worksMasonryEl.appendChild(
            el("p", "empty-state", "Belum ada karya pada kategori ini. Tambahkan item di berkas data.js.")
          );
          return;
        }

        const colCount = getColumnCount();
        lastColCount = colCount;
        const columns = [];
        const heights = [];

        for (let i = 0; i < colCount; i += 1) {
          const colEl = el("div", "masonry-col");
          columns.push(colEl);
          heights.push(0);
          worksMasonryEl.appendChild(colEl);
        }

        filteredWorks.forEach((work, idx) => {
          // Pilih kolom paling pendek agar tinggi masonry seimbang & tetap urut kiri-ke-kanan
          let targetCol = 0;
          for (let c = 1; c < colCount; c += 1) {
            if (heights[c] < heights[targetCol]) {
              targetCol = c;
            }
          }

          const article = el("article", "work-item");
          const trigger = el("button", "work-trigger");
          trigger.type = "button";
          trigger.setAttribute("aria-label", "Lihat detail karya: " + str(work.title));

          const media = el("div", "work-media");
          const ratio = safeAspectRatio(work.aspectRatio);
          media.style.aspectRatio = ratio;

          mountResilientMedia(media, {
            src: work.image,
            alt: work.imageAlt,
            title: work.title,
            tag: work.category,
            color: work.fallbackColor,
            index: idx,
            compact: false
          });

          const meta = el("div", "work-meta");
          const metaTop = el("div", "work-meta-top");
          metaTop.append(
            el("span", "work-title", str(work.title)),
            el("span", "work-arrow", "↗")
          );
          metaTop.lastChild.setAttribute("aria-hidden", "true");

          const subParts = [str(work.category), str(work.year)].filter(Boolean);
          meta.append(metaTop, el("span", "work-sub", subParts.join(" · ")));

          trigger.append(media, meta);
          trigger.addEventListener("click", () => {
            openLightbox("work", idx, trigger);
          });

          article.appendChild(trigger);
          columns[targetCol].appendChild(article);

          // Estimasi tinggi relatif item untuk keseimbangan kolom
          heights[targetCol] += parseRatioNumber(ratio) + 0.28;
        });
      }

      initFilters();
      renderMasonry();

      let resizeTimer = null;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => {
          const nextCols = getColumnCount();
          if (nextCols !== lastColCount) {
            renderMasonry();
          }
        }, 120);
      });

      /* ----------------------------------------------------------------------
         3. DAFTAR SERTIFIKAT (F4, F5)
         ---------------------------------------------------------------------- */
      const certsListEl = document.getElementById("certs-list");
      const certsCountEl = document.getElementById("certs-count");
      certsCountEl.textContent = certs.length + " sertifikat";

      if (certs.length === 0) {
        certsListEl.appendChild(
          el("li", "empty-state", "Belum ada sertifikat tersimpan. Tambahkan di array certs pada data.js.")
        );
      } else {
        certs.forEach((cert, idx) => {
          const row = el("li", "cert-row");

          const thumbBtn = el("button", "cert-thumb-btn");
          thumbBtn.type = "button";
          thumbBtn.setAttribute("aria-label", "Buka pratinjau sertifikat " + str(cert.title));

          mountResilientMedia(thumbBtn, {
            src: cert.image,
            alt: cert.imageAlt,
            title: cert.title,
            tag: cert.year || "Sertifikat",
            color: cert.fallbackColor,
            index: idx,
            compact: true
          });

          thumbBtn.addEventListener("click", () => {
            openLightbox("cert", idx, thumbBtn);
          });

          const mainCol = el("div", "cert-main");
          mainCol.appendChild(el("h3", "cert-title", str(cert.title)));
          if (str(cert.summary)) {
            mainCol.appendChild(el("p", "cert-summary", str(cert.summary)));
          }

          const issuerCol = el("div", "cert-issuer-col");
          issuerCol.appendChild(el("span", "cert-issuer", str(cert.issuer)));
          if (str(cert.credentialNote)) {
            issuerCol.appendChild(el("span", "cert-note", str(cert.credentialNote)));
          }

          const yearEl = el("span", "cert-year", str(cert.year));

          const actions = el("div", "cert-actions");
          const previewBtn = el("button", "btn-outline", "Pratinjau");
          previewBtn.type = "button";
          previewBtn.setAttribute("aria-label", "Pratinjau sertifikat " + str(cert.title));
          previewBtn.addEventListener("click", () => {
            openLightbox("cert", idx, previewBtn);
          });
          actions.appendChild(previewBtn);

          const verifyHref = safeExternalUrl(cert.verifyUrl);
          if (verifyHref) {
            const verifyLink = el("a", "btn-outline", "Verifikasi ↗");
            verifyLink.href = verifyHref;
            verifyLink.target = "_blank";
            verifyLink.rel = "noopener noreferrer";
            verifyLink.setAttribute("aria-label", "Verifikasi sertifikat " + str(cert.title) + " (tab baru)");
            actions.appendChild(verifyLink);
          }

          row.append(thumbBtn, mainCol, issuerCol, yearEl, actions);
          certsListEl.appendChild(row);
        });
      }

      /* ----------------------------------------------------------------------
         4. TENTANG
         ---------------------------------------------------------------------- */
      document.getElementById("about-lead").textContent = str(about.lead);

      const aboutParasEl = document.getElementById("about-paragraphs");
      (Array.isArray(about.paragraphs) ? about.paragraphs : []).forEach((text) => {
        if (str(text)) aboutParasEl.appendChild(el("p", "", str(text)));
      });

      document.getElementById("about-disciplines-title").textContent =
        str(about.disciplinesTitle) || "Bidang Kerja";
      const discListEl = document.getElementById("about-disciplines");
      (Array.isArray(about.disciplines) ? about.disciplines : []).forEach((item) => {
        if (str(item)) discListEl.appendChild(el("li", "", str(item)));
      });

      document.getElementById("about-principles-title").textContent =
        str(about.principlesTitle) || "Cara Kerja";
      const princListEl = document.getElementById("about-principles");
      (Array.isArray(about.principles) ? about.principles : []).forEach((item) => {
        const li = el("li", "principle-item");
        if (str(item.label)) li.appendChild(el("strong", "", str(item.label)));
        if (str(item.detail)) li.appendChild(el("span", "", str(item.detail)));
        princListEl.appendChild(li);
      });

      /* ----------------------------------------------------------------------
         5. KONTAK & FOOTER
         ---------------------------------------------------------------------- */
      document.getElementById("contact-lead").textContent = str(contact.lead);
      document.getElementById("contact-note").textContent = str(contact.note);

      const emailRow = document.getElementById("contact-email-row");
      const copyStatusEl = document.getElementById("copy-status");
      const email = str(contact.email);

      if (email) {
        const mailLink = el("a", "email-link", email);
        mailLink.href = "mailto:" + encodeURIComponent(email).replace(/%40/g, "@");
        emailRow.appendChild(mailLink);

        const copyBtn = el("button", "btn-outline", "Salin Email");
        copyBtn.type = "button";
        let copyTimer = null;

        copyBtn.addEventListener("click", async () => {
          let copied = false;
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(email);
              copied = true;
            }
          } catch (_) {
            copied = false;
          }

          if (!copied) {
            const temp = document.createElement("textarea");
            temp.value = email;
            temp.setAttribute("readonly", "");
            temp.style.position = "fixed";
            temp.style.opacity = "0";
            document.body.appendChild(temp);
            temp.select();
            try {
              copied = document.execCommand("copy");
            } catch (_) {
              copied = false;
            }
            temp.remove();
          }

          window.clearTimeout(copyTimer);
          if (copied) {
            copyBtn.textContent = "Email Disalin ✓";
            copyStatusEl.textContent = "Alamat email " + email + " berhasil disalin ke papan klip.";
          } else {
            copyBtn.textContent = "Pilih & Salin Manual";
            copyStatusEl.textContent = "Tidak dapat menyalin otomatis. Silakan salin alamat " + email + " secara manual.";
          }

          copyTimer = window.setTimeout(() => {
            copyBtn.textContent = "Salin Email";
          }, 2400);
        });

        emailRow.appendChild(copyBtn);
      }

      const contactLinksEl = document.getElementById("contact-links");
      (Array.isArray(contact.links) ? contact.links : []).forEach((item) => {
        const url = safeExternalUrl(item.url);
        if (!url || !str(item.label)) return;
        const a = el("a", "btn-outline", str(item.label) + " ↗");
        a.href = url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", str(item.label) + " (tab baru)");
        contactLinksEl.appendChild(a);
      });

      const currentYear = new Date().getFullYear();
      const footerParts = [
        "© " + currentYear + " " + (str(site.shortName) || "Portofolio"),
        str(site.footerNote)
      ].filter(Boolean);
      document.getElementById("footer-copy").textContent = footerParts.join(" · ");

      /* ----------------------------------------------------------------------
         6. LIGHTBOX DIALOG (F3 & F4) — ESC, BACKDROP, PANAH, RESTORE FOKUS
         ---------------------------------------------------------------------- */
      const dialog = document.getElementById("lightbox-dialog");
      const dialogCounter = document.getElementById("lightbox-counter");
      const dialogBody = document.getElementById("lightbox-body");
      const dialogScroll = document.getElementById("lightbox-scroll");
      const btnPrev = document.getElementById("lightbox-prev");
      const btnNext = document.getElementById("lightbox-next");
      const btnClose = document.getElementById("lightbox-close");

      const lightboxState = {
        mode: "work",
        index: 0,
        trigger: null
      };

      function getCurrentCollection() {
        return lightboxState.mode === "work" ? filteredWorks : certs;
      }

      function renderLightboxContent() {
        const list = getCurrentCollection();
        if (!list.length) return;

        const idx = ((lightboxState.index % list.length) + list.length) % list.length;
        lightboxState.index = idx;
        const item = list[idx];

        const prefix = lightboxState.mode === "work" ? "Karya" : "Sertifikat";
        dialogCounter.textContent =
          prefix + " " + String(idx + 1).padStart(2, "0") + " / " + String(list.length).padStart(2, "0");

        const hasMultiple = list.length > 1;
        btnPrev.hidden = !hasMultiple;
        btnNext.hidden = !hasMultiple;

        dialogBody.replaceChildren();

        const stage = el("div", "lightbox-stage");
        if (!safeAssetPath(item.image)) {
          stage.style.aspectRatio = lightboxState.mode === "work"
            ? safeAspectRatio(item.aspectRatio)
            : "4 / 3";
        }
        mountResilientMedia(stage, {
          src: item.image,
          alt: item.imageAlt,
          title: item.title,
          tag: lightboxState.mode === "work" ? item.category : item.issuer,
          color: item.fallbackColor,
          index: idx,
          eager: true,
          compact: false
        });

        const info = el("div", "lightbox-info");
        const titleEl = el("h2", "lightbox-title", str(item.title));
        titleEl.id = "lightbox-title";
        info.appendChild(titleEl);

        if (lightboxState.mode === "work") {
          const facts = el("div", "lightbox-facts");
          [str(item.category), str(item.year), str(item.client)]
            .filter(Boolean)
            .forEach((f) => facts.appendChild(el("span", "", f)));
          info.appendChild(facts);

          const blocks = el("div", "case-blocks");
          const triples = [
            { label: "Masalah", text: str(item.problem) },
            { label: "Peran", text: str(item.role) },
            { label: "Hasil", text: str(item.result) }
          ];

          triples.forEach((entry) => {
            if (!entry.text) return;
            const block = el("div", "case-block");
            block.append(
              el("h3", "case-label", entry.label),
              el("p", "case-text", entry.text)
            );
            blocks.appendChild(block);
          });
          info.appendChild(blocks);

          if (Array.isArray(item.tools) && item.tools.length > 0) {
            const toolsList = el("ul", "tools-list");
            toolsList.setAttribute("aria-label", "Alat dan media");
            item.tools.forEach((t) => {
              if (str(t)) toolsList.appendChild(el("li", "tool-tag", str(t)));
            });
            info.appendChild(toolsList);
          }

          const projectHref = safeExternalUrl(item.projectUrl);
          if (projectHref) {
            const ext = el("div", "lightbox-ext");
            const link = el("a", "btn-solid", "Buka Tautan Karya ↗");
            link.href = projectHref;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            ext.appendChild(link);
            info.appendChild(ext);
          }
        } else {
          const facts = el("div", "lightbox-facts");
          [str(item.issuer), str(item.year)]
            .filter(Boolean)
            .forEach((f) => facts.appendChild(el("span", "", f)));
          info.appendChild(facts);

          const blocks = el("div", "case-blocks");
          if (str(item.summary)) {
            const b1 = el("div", "case-block");
            b1.append(
              el("h3", "case-label", "Kompetensi"),
              el("p", "case-text", str(item.summary))
            );
            blocks.appendChild(b1);
          }
          if (str(item.credentialNote)) {
            const b2 = el("div", "case-block");
            b2.append(
              el("h3", "case-label", "Catatan Kredensial"),
              el("p", "case-text", str(item.credentialNote))
            );
            blocks.appendChild(b2);
          }
          info.appendChild(blocks);

          const verifyHref = safeExternalUrl(item.verifyUrl);
          if (verifyHref) {
            const ext = el("div", "lightbox-ext");
            const link = el("a", "btn-solid", "Verifikasi Kredensial ↗");
            link.href = verifyHref;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            ext.appendChild(link);
            info.appendChild(ext);
          }
        }

        dialogBody.append(stage, info);
        dialogScroll.scrollTop = 0;
      }

      function openLightbox(mode, index, triggerEl) {
        lightboxState.mode = mode;
        lightboxState.index = index;
        lightboxState.trigger = triggerEl || document.activeElement;
        renderLightboxContent();
        if (!dialog.open) {
          dialog.showModal();
        }
        btnClose.focus();
      }

      function closeLightbox() {
        if (dialog.open) {
          dialog.close();
        }
      }

      btnClose.addEventListener("click", closeLightbox);
      btnPrev.addEventListener("click", () => {
        lightboxState.index -= 1;
        renderLightboxContent();
      });
      btnNext.addEventListener("click", () => {
        lightboxState.index += 1;
        renderLightboxContent();
      });

      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) {
          closeLightbox();
        }
      });

      dialog.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          lightboxState.index -= 1;
          renderLightboxContent();
        } else if (event.key === "ArrowRight") {
          event.preventDefault();
          lightboxState.index += 1;
          renderLightboxContent();
        }
      });

      dialog.addEventListener("close", () => {
        if (lightboxState.trigger && typeof lightboxState.trigger.focus === "function") {
          lightboxState.trigger.focus();
        }
      });
    })();
  </script>
</body>
</html>
